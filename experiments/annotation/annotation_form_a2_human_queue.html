rithm to multiply polynomials by repeatedly applying the distributive property."}, {"item_id": "EN-11-machine-003", "video_id": "EN-11", "model": "openai/whisper-large-v3-turbo|Qwen/Qwen3.5-4B", "lang": "en", "term": "public goods", "explanation": "Items that are available to everyone and cannot be used up by one person's consumption.", "context": "These are often called public goods, but the technical definition of a public good is anything that has two characteristics, non-exclusion and non-rivalry."}, {"item_id": "EN-13-machine-004", "video_id": "EN-13", "model": "openai/whisper-large-v3-turbo|Qwen/Qwen3.5-4B", "lang": "en", "term": "equilibrium", "explanation": "A state where internal forces within a beam balance out so that the beam remains stable under loading conditions.", "context": "When a beam is loaded, internal forces develop within it to maintain equilibrium."}, {"item_id": "EN-16-machine-017", "video_id": "EN-16", "model": "openai/whisper-large-v3-turbo|Qwen/Qwen3.5-4B", "lang": "en", "term": "value representation", "explanation": "A way of writing a polynomial as a list of input-output pairs (points).", "context": "We know multiplication is faster using the value representation, so what we'll do is evaluate each of these polynomials at 2d plus 1 points, multiply each of these points pairwise to get the value representation of the product polynomial, and then finally, somehow convert the value representation back to the final coefficient representation."}, {"item_id": "EN-11-machine-008", "video_id": "EN-11", "model": "openai/whisper-large-v3-turbo|Qwen/Qwen3.5-4B", "lang": "en", "term": "externalities", "explanation": "Situations where costs or benefits affect people outside the main transaction.", "context": "There's no better example of this than what economists call externalities."}, {"item_id": "EN-16-machine-015", "video_id": "EN-16", "model": "openai/whisper-large-v3-turbo|Qwen/Qwen3.5-4B", "lang": "en", "term": "determinant", "explanation": "A scalar value calculated from a matrix that indicates whether the matrix has an inverse.", "context": "The easiest way to show this is by calculating the determinant, which you will find is non-zero, but I'll link a nice linear algebraic proof of this fact in the description as well for those interested."}, {"item_id": "EN-16-machine-014", "video_id": "EN-16", "model": "openai/whisper-large-v3-turbo|Qwen/Qwen3.5-4B", "lang": "en", "term": "coefficients", "explanation": "The numerical factors in a polynomial that determine its specific shape and behavior.", "context": "We want to show that for these set of points, there is only one set of coefficients."}, {"item_id": "EN-16-machine-003", "video_id": "EN-16", "model": "openai/whisper-large-v3-turbo|Qwen/Qwen3.5-4B", "lang": "en", "term": "signal processing", "explanation": "The field of engineering that deals with the analysis, modification, and synthesis of signals.", "context": "So much of the modern technology that we have today such as wireless communication, GPS, and in fact anything related to the vast field of signal processing relies on the insights of the FFT."}, {"item_id": "EN-16-machine-001", "video_id": "EN-16", "model": "openai/whisper-large-v3-turbo|Qwen/Qwen3.5-4B", "lang": "en", "term": "Fast Fourier Transform", "explanation": "A mathematical technique used to analyze signals by converting them from time domain to frequency domain.", "context": "Today I want to talk about an algorithm that rightfully belongs in both classes, and my personal favorite algorithm, the Fast Fourier Transform."}, {"item_id": "EN-16-machine-002", "video_id": "EN-16", "model": "openai/whisper-large-v3-turbo|Qwen/Qwen3.5-4B", "lang": "en", "term": "discrete Fourier transform", "explanation": "A specific mathematical method for calculating the frequency components of a discrete set of data points.", "context": "It's often introduced in fairly complex settings that require a lot of prerequisite knowledge such as the discrete Fourier transform, time domain to frequency domain conversions, and much more."}, {"item_id": "EN-16-machine-005", "video_id": "EN-16", "model": "openai/whisper-large-v3-turbo|Qwen/Qwen3.5-4B", "lang": "en", "term": "FFT", "explanation": "A fast algorithm for performing polynomial multiplication by transforming the problem into a different representation.", "context": "We'll take a discovery-based approach to learning about the FFT in a context that you are all familiar with, polynomial multiplication."}, {"item_id": "EN-16-machine-013", "video_id": "EN-16", "model": "openai/whisper-large-v3-turbo|Qwen/Qwen3.5-4B", "lang": "en", "term": "polynomial", "explanation": "A mathematical expression consisting of variables and coefficients combined using addition, subtraction, and multiplication.", "context": "So, if we actually evaluate our polynomial at each of these points, we get the following set of system of equations."}];
const ANN = "a2";
const KEY = "eduterm-anno-" + ANN;
const state = JSON.parse(localStorage.getItem(KEY) || '{"labels":{},"index":0}');
const labels = state.labels || {};
let index = Math.min(state.index || 0, ITEMS.length);

const card = document.getElementById('card');
const fill = document.getElementById('fill');
const countEl = document.getElementById('count');
const toastEl = document.getElementById('toast');

let mode = 'R';
let draft = null;

function save() { localStorage.setItem(KEY, JSON.stringify({labels, index})); }

function toast(msg) {
  toastEl.textContent = msg; toastEl.classList.add('on');
  clearTimeout(toast.t); toast.t = setTimeout(() => toastEl.classList.remove('on'), 1200);
}

function esc(s) { return String(s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function markTerm(ctx, term) {
  const safe = esc(ctx);
  if (!term) return safe;
  const t = esc(term).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return safe.replace(new RegExp('(' + t + ')', 'ig'), '<mark>$1</mark>');
}

function labeledCount() { return ITEMS.filter(it => labels[it.item_id] && labels[it.item_id].R !== undefined && labels[it.item_id].D !== undefined).length; }

function render() {
  const done = labeledCount();
  fill.style.width = (ITEMS.length ? (100 * done / ITEMS.length) : 0) + '%';
  countEl.textContent = done + '/' + ITEMS.length;

  if (index >= ITEMS.length) {
    card.innerHTML = '<div class="done"><h2>Bitti.</h2><p class="meta">' + done + ' madde etiketlendi. Sağ üstteki <b>CSV indir</b> ile dosyayı dışa aktar.</p></div>';
    return;
  }
  const it = ITEMS[index];
  const cur = labels[it.item_id];
  if (!cur || (cur.R === undefined) || (cur.D === undefined)) {
    mode = (!cur || cur.R === undefined) ? 'R' : 'D';
  } else {
    mode = 'R';
  }
  const shown = cur ? Object.assign({}, cur) : {};
  if (draft && draft.item_id === it.item_id) { shown.R = draft.R; shown.D = draft.D; shown.comment = draft.comment; }

  const modeHtml = mode === 'R'
    ? '<span class="pill r">şimdi: R — bağlam uyumu</span><span class="keys"><kbd>1</kbd> tutarlı · <kbd>0</kbd> değil</span>'
    : '<span class="pill d">şimdi: D — tanım doğruluğu</span><span class="keys"><kbd>1</kbd> doğru · <kbd>0</kbd> değil</span>';

  card.innerHTML =
    '<div class="meta">' + esc(it.video_id) + ' · ' + esc(it.lang) + ' · ' + (index + 1) + '. madde' +
      (cur && cur.R !== undefined ? ' · R=' + cur.R : '') +
      (cur && cur.D !== undefined ? ' · D=' + cur.D : '') + '</div>' +
    '<div class="term">' + esc(it.term) + '</div>' +
    '<div class="label">Açıklama</div>' +
    '<div class="expl">' + esc(it.explanation) + '</div>' +
    (it.context ? '<div class="label">Transkript bağlamı</div><div class="ctx">' + markTerm(it.context, it.term) + '</div>' : '') +
    '<div class="mode">' + modeHtml + '</div>' +
    '<div class="options">' +
      '<button class="opt yes" data-v="1"><b>1 — evet</b>' + (mode === 'R' ? 'Terim bağlama uygun' : 'Tanım doğru') + '</button>' +
      '<button class="opt no" data-v="0"><b>0 — hayır</b>' + (mode === 'R' ? 'Bağlama uygun değil' : 'Tanım hatalı') + '</button>' +
    '</div>' +
    '<textarea id="comment" placeholder="Not (isteğe bağlı, n ile odaklan)">' + esc(shown.comment || '') + '</textarea>' +
    '<div class="row">' +
      '<button id="prev">← önceki (Backspace)</button>' +
      '<button id="skip">atla (s) →</button>' +
      '<button id="exp2">CSV indir</button>' +
    '</div>';

  card.querySelectorAll('button.opt').forEach(b => b.addEventListener('click', () => choose(b.dataset.v, b)));
  document.getElementById('prev').addEventListener('click', prev);
  document.getElementById('skip').addEventListener('click', skip);
  document.getElementById('exp2').addEventListener('click', exportCsv);
}

function choose(v, btn) {
  if (index >= ITEMS.length) return;
  const it = ITEMS[index];
  const cur = labels[it.item_id] || {};
  const val = Number(v);
  const comment = (document.getElementById('comment') || {}).value || cur.comment || '';
  if (mode === 'R') {
    labels[it.item_id] = {R: val, D: cur.D, comment};
    draft = {item_id: it.item_id, R: val, D: cur.D, comment};
    mode = 'D';
    save();
    render();
    toast('R=' + val + ' · şimdi D');
  } else {
    labels[it.item_id] = {R: cur.R, D: val, comment};
    draft = null;
    index += 1;
    save();
    render();
    toast('kaydedildi');
  }
}

function prev() {
  if (index > 0) { index -= 1; draft = null; save(); render(); }
}

function skip() { if (index < ITEMS.length) { index += 1; draft = null; save(); render(); } }

function exportCsv() {
  const head = ['item_id','video_id','model','lang','term','explanation','R','D','comment'];
  const rows = [head.join(',')];
  for (const it of ITEMS) {
    const l = labels[it.item_id];
    if (!l || l.R === undefined || l.D === undefined) continue;
    const cell = x => '"' + String(x === undefined || x === null ? '' : x).replace(/"/g, '""') + '"';
    rows.push([it.item_id, it.video_id, it.model, it.lang, it.term, it.explanation, l.R, l.D, l.comment || ''].map(cell).join(','));
  }
  const blob = new Blob(['\ufeff' + rows.join('\r\n')], {type: 'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'labels_' + ANN + '_new.csv';
  document.body.appendChild(a); a.click(); a.remove();
  toast(rows.length - 1 + ' satır indirildi');
}

document.getElementById('export').addEventListener('click', exportCsv);

document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'textarea') {
    if (e.key === 'Escape') { e.target.blur(); }
    return;
  }
  if (e.key === '1' || e.key === '0') { e.preventDefault(); choose(e.key, null); }
  else if (e.key === 'Backspace') { e.preventDefault(); prev(); }
  else if (e.key === 's' || e.key === 'S') { e.preventDefault(); skip(); }
  else if (e.key === 'n' || e.key === 'N') { const t = document.getElementById('comment'); if (t) { e.preventDefault(); t.focus(); } }
});

render();
</script>
</body>
</html>
