xplanation": "Heat energy transferred via electromagnetic waves without needing physical contact or air.", "context": "It's these electromagnetic waves that produce thermal radiation."}, {"item_id": "EN-04-machine-003", "video_id": "EN-04", "model": "openai/whisper-large-v3-turbo|Qwen/Qwen3.5-4B", "lang": "en", "term": "photovoltaic cells", "explanation": "Devices that convert sunlight directly into electricity.", "context": "Whether it's to design photovoltaic cells, heat exchangers, or energy efficient structures, engineers need to be able to model the effects of thermal radiation."}, {"item_id": "EN-04-machine-004", "video_id": "EN-04", "model": "openai/whisper-large-v3-turbo|Qwen/Qwen3.5-4B", "lang": "en", "term": "emissive power", "explanation": "The total energy a body radiates each second per unit of surface area.", "context": "The total energy radiated by a body each second, per unit area, is called the emissive power E."}, {"item_id": "EN-04-machine-005", "video_id": "EN-04", "model": "openai/whisper-large-v3-turbo|Qwen/Qwen3.5-4B", "lang": "en", "term": "black body", "explanation": "A theoretical object that emits the maximum possible amount of thermal radiation at a given temperature.", "context": "This theoretical object is called a black body."}, {"item_id": "EN-04-machine-006", "video_id": "EN-04", "model": "openai/whisper-large-v3-turbo|Qwen/Qwen3.5-4B", "lang": "en", "term": "Stefan-Boltzmann law", "explanation": "A simple law used to calculate the emissive power of a black body based on temperature.", "context": "The emissive power of a black body can be calculated using a surprisingly simple law called the Stefan-Boltzmann law."}, {"item_id": "EN-04-machine-007", "video_id": "EN-04", "model": "openai/whisper-large-v3-turbo|Qwen/Qwen3.5-4B", "lang": "en", "term": "blackbody", "explanation": "An idealized physical object that absorbs all incident electromagnetic radiation and emits energy based solely on its temperature.", "context": "As the temperature of the blackbody increases, the total emissive power increases very quickly, so we'll need to switch to a log scale graph to be able to compare distributions for different temperatures."}, {"item_id": "EN-04-machine-008", "video_id": "EN-04", "model": "openai/whisper-large-v3-turbo|Qwen/Qwen3.5-4B", "lang": "en", "term": "Wien's displacement law", "explanation": "A physical law stating that the wavelength at which a black body emits the most radiation is inversely proportional to its temperature.", "context": "It varies with temperature and is given by a relation called Wien's displacement law."}, {"item_id": "EN-05-machine-001", "video_id": "EN-05", "model": "openai/whisper-large-v3-turbo|Qwen/Qwen3.5-4B", "lang": "en", "term": "backpropagation", "explanation": "The main algorithm used to teach neural networks by adjusting their internal settings based on errors.", "context": "Here we tackle backpropagation, the core algorithm behind how neural networks learn."}, {"item_id": "EN-05-machine-002", "video_id": "EN-05", "model": "openai/whisper-large-v3-turbo|Qwen/Qwen3.5-4B", "lang": "en", "term": "neural network", "explanation": "A computer system inspired by the human brain that learns by recognizing patterns in data.", "context": "Here we tackle backpropagation, the core algorithm behind how neural networks learn."}, {"item_id": "EN-05-machine-003", "video_id": "EN-05", "model": "openai/whisper-large-v3-turbo|Qwen/Qwen3.5-4B", "lang": "en", "term": "gradient descent", "explanation": "A method that moves in the direction of steepest decline to find the best possible settings for a system.", "context": "I'm also expecting you to understand gradient descent, as described in the last video, and And how what we mean by learning is that we want to find which weights and biases minimize a certain cost function."}, {"item_id": "EN-05-machine-004", "video_id": "EN-05", "model": "openai/whisper-large-v3-turbo|Qwen/Qwen3.5-4B", "lang": "en", "term": "cost function", "explanation": "A measure that calculates how wrong the network's predictions are compared to the correct answers.", "context": "And how what we mean by learning is that we want to find which weights and biases minimize a certain cost function."}, {"item_id": "EN-05-machine-005", "video_id": "EN-05", "model": "openai/whisper-large-v3-turbo|Qwen/Qwen3.5-4B", "lang": "en", "term": "negative gradient", "explanation": "The direction and magnitude indicating how to adjust weights to most efficiently reduce the cost function.", "context": "And as if that's not enough to think about, as described in the last video, the thing that we're looking for is the negative gradient of this cost function, which tells you how you need to change all of the weights and biases, all of these connections, so as to most efficiently decrease the cost."}, {"item_id": "EN-05-machine-006", "video_id": "EN-05", "model": "openai/whisper-large-v3-turbo|Qwen/Qwen3.5-4B", "lang": "en", "term": "weights", "explanation": "Adjustable parameters in a neural network that determine the strength of connections between nodes.", "context": "And as if that's not enough to think about, as described in the last video, the thing that we're looking for is the negative gradient of this cost function, which tells you how you need to change all of the weights and biases, all of these connections, so as to most efficiently decrease the cost."}, {"item_id": "EN-05-machine-007", "video_id": "EN-05", "model": "openai/whisper-large-v3-turbo|Qwen/Qwen3.5-4B", "lang": "en", "term": "weights and biases", "explanation": "Adjustable parameters in a neural network that determine how much influence each input has on the output.", "context": "So I'm going to start things off here with a complete disregard for the notation, and just step through those effects that each training example is having on the weights and biases."}, {"item_id": "EN-05-machine-008", "video_id": "EN-05", "model": "openai/whisper-large-v3-turbo|Qwen/Qwen3.5-4B", "lang": "en", "term": "activations", "explanation": "The output values produced by a neuron or layer in a neural network after applying its weights and biases to the input.", "context": "Now we can't directly change those activations, we only have influence on the weights and biases, but it is helpful to keep track of which adjustments we wish should take place to that output layer."}, {"item_id": "EN-06-machine-001", "video_id": "EN-06", "model": "openai/whisper-large-v3-turbo|Qwen/Qwen3.5-4B", "lang": "en", "term": "SQL", "explanation": "A programming language used to manage and manipulate data in relational databases.", "context": "We will start by defining a set of fundamental concepts before giving you the first taste of SQL, or C-SQL."}, {"item_id": "EN-06-machine-002", "video_id": "EN-06", "model": "openai/whisper-large-v3-turbo|Qwen/Qwen3.5-4B", "lang": "en", "term": "RMDBS", "explanation": "A type of database that organizes data into tables to manage relationships between different pieces of information.", "context": "Why do all modern apps, from social media to your banks, rely on something called an RMDBS?"}, {"item_id": "EN-06-machine-003", "video_id": "EN-06", "model": "openai/whisper-large-v3-turbo|Qwen/Qwen3.5-4B", "lang": "en", "term": "primary key", "explanation": "A unique identifier in a table that distinguishes each record from all other records.", "context": "It starts simple, name, email and phone numbers but then someone gets added toys someone else email gets overwritten now you're trying to track payments committees event rsvps and it's chaos that's when you realize you need structure you need a better way to organize connect and protect your data this is where databases come in but what exactly is a database why do they organize data into tables and what makes something a primary key."}, {"item_id": "EN-06-machine-004", "video_id": "EN-06", "model": "openai/whisper-large-v3-turbo|Qwen/Qwen3.5-4B", "lang": "en", "term": "entity", "explanation": "A real-world object, person, or concept that is represented within a database table.", "context": "However, a table is different from a spreadsheet with data, because a table is used to represent an entity or a relationship between entities."}, {"item_id": "EN-06-machine-005", "video_id": "EN-06", "model": "openai/whisper-large-v3-turbo|Qwen/Qwen3.5-4B", "lang": "en", "term": "attributes", "explanation": "Specific characteristics or properties used to describe an entity, like name, description, price, and manufacturer.", "context": "Products sold by the Sci-Fi Collective are entities, and each can be described by at least four attributes, the name, description, price, and manufacturer."}, {"item_id": "EN-06-machine-006", "video_id": "EN-06", "model": "openai/whisper-large-v3-turbo|Qwen/Qwen3.5-4B", "lang": "en", "term": "Sci-Fi Collective", "explanation": "The specific name of the online store mentioned as an example for selling Sci-Fi products.", "context": "Suppose that we are running an online store that's called the Sci-Fi Collective, which sells the Sci-Fi products, such as time machines that take you back only 5 minutes, in case you forget your keys."}, {"item_id": "EN-06-machine-007", "video_id": "EN-06", "model": "openai/whisper-large-v3-turbo|Qwen/Qwen3.5-4B", "lang": "en", "term": "data redundancy", "explanation": "When the same data appears in multiple places, causing issues like needing to delete it from every location when one item changes.", "context": "You can spot the data redundancy issues first, like this."}, {"item_id": "EN-06-machine-008", "video_id": "EN-06", "model": "openai/whisper-large-v3-turbo|Qwen/Qwen3.5-4B", "lang": "en", "term": "delete anomaly", "explanation": "A problem where deleting a product requires also deleting associated customer information, which is often unwanted.", "context": "This problem is known as delete anomaly."}, {"item_id": "EN-06-machine-009", "video_id": "EN-06", "model": "openai/whisper-large-v3-turbo|Qwen/ entially SQLite Online is a database running on the cloud."}, {"item_id": "EN-06-machine-015", "video_id": "EN-06", "model": "openai/whisper-large-v3-turbo|Qwen/Qwen3.5-4B", "lang": "en", "term": "VS coding", "explanation": "A code editor environment used to open and manage database project files.", "context": "I already have the repo cloned locally on my machine, so I'm gonna open it in the VS coding environment."}, {"item_id": "EN-06-machine-016", "video_id": "EN-06", "model": "openai/whisper-large-v3-turbo|Qwen/Qwen3.5-4B", "lang": "en", "term": "SELECTNAME", "explanation": "A command used to retrieve specific data from a database table.", "context": "Thus, the query was SELECTNAME FROM PRODUCT, WHERE PRICE BIGGER THAN 20."}, {"item_id": "EN-06-machine-017", "video_id": "EN-06", "model": "openai/whisper-large-v3-turbo|Qwen/Qwen3.5-4B", "lang": "en", "term": "Verisql", "explanation": "A specific query language used to retrieve data from a database table.", "context": "You also wrote your first Verisql query to retrieve data from a table."}, {"item_id": "EN-06-machine-018", "video_id": "EN-06", "model": "openai/whisper-large-v3-turbo|Qwen/Qwen3.5-4B", "lang": "en", "term": "primary keys", "explanation": "Unique identifiers used by a relational database to organize data into tables.", "context": "You learned what a relational database is, and how it organizes data into tables based on entities using primary keys."}, {"item_id": "EN-06-machine-019", "video_id": "EN-06", "model": "openai/whisper-large-v3-turbo|Qwen/Qwen3.5-4B", "lang": "en", "term": "SELECT", "explanation": "A SQL clause used to specify which columns or data fields the user wants to retrieve from a database table.", "context": "First, the SELECT clause allows you to specify the columns you want to retrieve from a table."}, {"item_id": "EN-06-machine-020", "video_id": "EN-06", "model": "openai/whisper-large-v3-turbo|Qwen/Qwen3.5-4B", "lang": "en", "term": "FROM", "explanation": "A SQL clause that identifies the source table or tables from which the data should be retrieved.", "context": "Second, the FROM clause specifies the source that you want to retrieve data from."}, {"item_id": "EN-06-machine-021", "video_id": "EN-06", "model": "openai/whisper-large-v3-turbo|Qwen/Qwen3.5-4B", "lang": "en", "term": "table", "explanation": "A structured collection of data organized into rows and columns within a database, representing entities like products.", "context": "Imagine that there's a table representing products in this database."}, {"item_id": "EN-06-machine-022", "video_id": "EN-06", "model": "openai/whisper-large-v3-turbo|Qwen/Qwen3.5-4B", "lang": "en", "term": "WHERE", "explanation": "A clause in a query that specifies conditions to filter which rows of data are returned.", "context": "Whenever you need only a subset of data that meets some criteria, you will need the help of the where clause to filter the data."}, {"item_id": "EN-06-machine-023", "video_id": "EN-06", "model": "openai/whisper-large-v3-turbo|Qwen/Qwen3.5-4B", "lang": "en", "term": "rows", "explanation": "Individual records or lines of data within a table that can be filtered based on specific conditions.", "context": "To be more specific, a subset of data here means rows, a bunch of rows."}, {"item_id": "EN-06-machine-024", "video_id": "EN-06", "model": "openai/whisper-large-v3-turbo|Qwen/Qwen3.5-4B", "lang": "en", "term": "numeric", "explanation": "A type of data representing numbers that can be used with mathematical comparisons like greater than or equal to.", "context": "In the product table, the data type of the price column is numeric. That's why you can filter price via the logical operators such as bigger than or bigger than or equal to."}, {"item_id": "EN-07-machine-001", "video_id": "EN-07", "model": "openai/whisper-large-v3-turbo|Qwen/Qwen3.5-4B", "lang": "en", "term": "graph search", "explanation": "A method for exploring a network of connected items to find specific information or pat  in a context that you are all familiar with, polynomial multiplication."}, {"item_id": "EN-16-machine-007", "video_id": "EN-16", "model": "openai/whisper-large-v3-turbo|Qwen/Qwen3.5-4B", "lang": "en", "term": "distributive property", "explanation": "An algebraic rule that allows multiplying a term by a group of terms by multiplying the term by each individual term in the group.", "context": "Mathematically, we know one algorithm to multiply polynomials by repeatedly applying the distributive property."}, {"item_id": "EN-16-machine-008", "video_id": "EN-16", "model": "openai/whisper-large-v3-turbo|Qwen/Qwen3.5-4B", "lang": "en", "term": "coefficient representation", "explanation": "A way of storing a polynomial as a list of numbers representing the values of its individual power terms.", "context": "We will refer to this representation as the coefficient representation of polynomials."}, {"item_id": "EN-16-machine-009", "video_id": "EN-16", "model": "openai/whisper-large-v3-turbo|Qwen/Qwen3.5-4B", "lang": "en", "term": "2d degree polynomials", "explanation": "A mathematical expression where the highest power of the variable is the product of two numbers, d and d.", "context": "In general, given 2d degree polynomials, the product will have a degree of 2 times d, and the running time of this algorithm, if we actually went about implementing it with the most natural distributed property approach, will be O , since each term in polynomial a will have to be multiplied by all terms in polynomial b."}, {"item_id": "EN-16-machine-010", "video_id": "EN-16", "model": "openai/whisper-large-v3-turbo|Qwen/Qwen3.5-4B", "lang": "en", "term": "linear function", "explanation": "A mathematical relationship where the graph forms a straight line, representing a direct proportional relationship between variables.", "context": "To see the key insight here, let's take a look at one of the simplest polynomials, a degree 1 polynomial or a linear function."}, {"item_id": "EN-16-machine-011", "video_id": "EN-16", "model": "openai/whisper-large-v3-turbo|Qwen/Qwen3.5-4B", "lang": "en", "term": "two-point representation", "explanation": "A specific way to describe a line using exactly two distinct locations on that line to define its position and slope.", "context": "There are actually several reasonable representations, but the one that we are going to use is the two-point representation."}, {"item_id": "EN-16-machine-012", "video_id": "EN-16", "model": "openai/whisper-large-v3-turbo|Qwen/Qwen3.5-4B", "lang": "en", "term": "quadratic function", "explanation": "A mathematical function involving a squared variable, resulting in a graph shaped like a parabola.", "context": "For example, if I gave you 3 random points, this means that there is exactly one quadratic function that goes through all 3 of these points."}, {"item_id": "EN-16-machine-013", "video_id": "EN-16", "model": "openai/whisper-large-v3-turbo|Qwen/Qwen3.5-4B", "lang": "en", "term": "polynomial", "explanation": "A mathematical expression consisting of variables and coefficients combined using addition, subtraction, and multiplication.", "context": "So, if we actually evaluate our polynomial at each of these points, we get the following set of system of equations."}, {"item_id": "EN-16-machine-014", "video_id": "EN-16", "model": "openai/whisper-large-v3-turbo|Qwen/Qwen3.5-4B", "lang": "en", "term": "coefficients", "explanation": "The numerical factors in a polynomial that determine its specific shape and behavior.", "context": "We want to show that for these set of points, there is only one set of coefficients."}, {"item_id": "EN-16-machine-015", "video_id": "EN-16", "model": "openai/whisper-large-v3-turbo|Qwen/Qwen3.5-4B", "lang": "en", "term": "determinant", "explanation": "A scalar value calculated from a matrix that indicates whether the matrix has an inverse.", "context": "The easiest way to show this is by calculating the determinant, which you will find is non-zero, but I'll link a nice linear algebraic proof of this fact in the description as well for those interested."}, {"item_id": "EN-16-machine-016", "video_id": "EN-16", "model": "openai/whisper-large-v3-turbo|Qwen/Qwen3.5-4B", "lang": "en", "term": "invertible", "explanation": "A property of a matrix meaning it can be reversed or undone to produce the original data.", "context": "One nice property of this matrix is that if each of our original points is unique, as it is in this case, the matrix will always be invertible."}, {"item_id": "EN-16-machine-017", "video_id": "EN-16", "model": "openai/whisper-large-v3-turbo|Qwen/Qwen3.5-4B", "lang": "en", "term": "value representation", "explanation": "A way of writing a polynomial as a list of input-output pairs (points).", "context": "We know multiplication is faster using the value representation, so what we'll do is evaluate each of these polynomials at 2d plus 1 points, multiply each of these points pairwise to get the value representation of the product polynomial, and then finally, somehow convert the value representation back to the final coefficient representation."}];
const ANN = "a1";
const KEY = "eduterm-anno-" + ANN;
const state = JSON.parse(localStorage.getItem(KEY) || '{"labels":{},"index":0}');
const labels = state.labels || {};
let index = Math.min(state.index || 0, ITEMS.length);

const card = document.getElementById('card');
const fill = document.getElementById('fill');
const countEl = document.getElementById('count');
const toastEl = document.getElementById('toast');

let mode = 'R';
let draft = null;

function save() { localStorage.setItem(KEY, JSON.stringify({labels, index})); }

function toast(msg) {
  toastEl.textContent = msg; toastEl.classList.add('on');
  clearTimeout(toast.t); toast.t = setTimeout(() => toastEl.classList.remove('on'), 1200);
}

function esc(s) { return String(s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function markTerm(ctx, term) {
  const safe = esc(ctx);
  if (!term) return safe;
  const t = esc(term).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return safe.replace(new RegExp('(' + t + ')', 'ig'), '<mark>$1</mark>');
}

function labeledCount() { return ITEMS.filter(it => labels[it.item_id] && labels[it.item_id].R !== undefined && labels[it.item_id].D !== undefined).length; }

function render() {
  const done = labeledCount();
  fill.style.width = (ITEMS.length ? (100 * done / ITEMS.length) : 0) + '%';
  countEl.textContent = done + '/' + ITEMS.length;

  if (index >= ITEMS.length) {
    card.innerHTML = '<div class="done"><h2>Bitti.</h2><p class="meta">' + done + ' madde etiketlendi. Sağ üstteki <b>CSV indir</b> ile dosyayı dışa aktar.</p></div>';
    return;
  }
  const it = ITEMS[index];
  const cur = labels[it.item_id];
  if (!cur || (cur.R === undefined) || (cur.D === undefined)) {
    mode = (!cur || cur.R === undefined) ? 'R' : 'D';
  } else {
    mode = 'R';
  }
  const shown = cur ? Object.assign({}, cur) : {};
  if (draft && draft.item_id === it.item_id) { shown.R = draft.R; shown.D = draft.D; shown.comment = draft.comment; }

  const modeHtml = mode === 'R'
    ? '<span class="pill r">şimdi: R — bağlam uyumu</span><span class="keys"><kbd>1</kbd> tutarlı · <kbd>0</kbd> değil</span>'
    : '<span class="pill d">şimdi: D — tanım doğruluğu</span><span class="keys"><kbd>1</kbd> doğru · <kbd>0</kbd> değil</span>';

  card.innerHTML =
    '<div class="meta">' + esc(it.video_id) + ' · ' + esc(it.lang) + ' · ' + (index + 1) + '. madde' +
      (cur && cur.R !== undefined ? ' · R=' + cur.R : '') +
      (cur && cur.D !== undefined ? ' · D=' + cur.D : '') + '</div>' +
    '<div class="term">' + esc(it.term) + '</div>' +
    '<div class="label">Açıklama</div>' +
    '<div class="expl">' + esc(it.explanation) + '</div>' +
    (it.context ? '<div class="label">Transkript bağlamı</div><div class="ctx">' + markTerm(it.context, it.term) + '</div>' : '') +
    '<div class="mode">' + modeHtml + '</div>' +
    '<div class="options">' +
      '<button class="opt yes" data-v="1"><b>1 — evet</b>' + (mode === 'R' ? 'Terim bağlama uygun' : 'Tanım doğru') + '</button>' +
      '<button class="opt no" data-v="0"><b>0 — hayır</b>' + (mode === 'R' ? 'Bağlama uygun değil' : 'Tanım hatalı') + '</button>' +
    '</div>' +
    '<textarea id="comment" placeholder="Not (isteğe bağlı, n ile odaklan)">' + esc(shown.comment || '') + '</textarea>' +
    '<div class="row">' +
      '<button id="prev">← önceki (Backspace)</button>' +
      '<button id="skip">atla (s) →</button>' +
      '<button id="exp2">CSV indir</button>' +
    '</div>';

  card.querySelectorAll('button.opt').forEach(b => b.addEventListener('click', () => choose(b.dataset.v, b)));
  document.getElementById('prev').addEventListener('click', prev);
  document.getElementById('skip').addEventListener('click', skip);
  document.getElementById('exp2').addEventListener('click', exportCsv);
}

function choose(v, btn) {
  if (index >= ITEMS.length) return;
  const it = ITEMS[index];
  const cur = labels[it.item_id] || {};
  const val = Number(v);
  const comment = (document.getElementById('comment') || {}).value || cur.comment || '';
  if (mode === 'R') {
    labels[it.item_id] = {R: val, D: cur.D, comment};
    draft = {item_id: it.item_id, R: val, D: cur.D, comment};
    mode = 'D';
    save();
    render();
    toast('R=' + val + ' · şimdi D');
  } else {
    labels[it.item_id] = {R: cur.R, D: val, comment};
    draft = null;
    index += 1;
    save();
    render();
    toast('kaydedildi');
  }
}

function prev() {
  if (index > 0) { index -= 1; draft = null; save(); render(); }
}

function skip() { if (index < ITEMS.length) { index += 1; draft = null; save(); render(); } }

function exportCsv() {
  const head = ['item_id','video_id','model','lang','term','explanation','R','D','comment'];
  const rows = [head.join(',')];
  for (const it of ITEMS) {
    const l = labels[it.item_id];
    if (!l || l.R === undefined || l.D === undefined) continue;
    const cell = x => '"' + String(x === undefined || x === null ? '' : x).replace(/"/g, '""') + '"';
    rows.push([it.item_id, it.video_id, it.model, it.lang, it.term, it.explanation, l.R, l.D, l.comment || ''].map(cell).join(','));
  }
  const blob = new Blob(['\ufeff' + rows.join('\r\n')], {type: 'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'labels_' + ANN + '_new.csv';
  document.body.appendChild(a); a.click(); a.remove();
  toast(rows.length - 1 + ' satır indirildi');
}

document.getElementById('export').addEventListener('click', exportCsv);

document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'textarea') {
    if (e.key === 'Escape') { e.target.blur(); }
    return;
  }
  if (e.key === '1' || e.key === '0') { e.preventDefault(); choose(e.key, null); }
  else if (e.key === 'Backspace') { e.preventDefault(); prev(); }
  else if (e.key === 's' || e.key === 'S') { e.preventDefault(); skip(); }
  else if (e.key === 'n' || e.key === 'N') { const t = document.getElementById('comment'); if (t) { e.preventDefault(); t.focus(); } }
});

render();
</script>
</body>
</html>
