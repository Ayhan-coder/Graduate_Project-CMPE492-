<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>EduTerm CMPE 492 — Öğrenci Değerlendirme</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --muted:#94a3b8; --text:#f8fafc; --accent:#38bdf8; --ok:#22c55e; --warn:#f59e0b; --border:#334155; }
  * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { margin:0; background:var(--bg); color:var(--text); padding:14px 14px 40px; line-height:1.45; }
  h1 { font-size:1.2rem; margin:0 0 4px; color:var(--accent); }
  h2 { font-size:1.05rem; margin:0 0 10px; }
  .sub { font-size:0.84rem; color:var(--muted); margin-bottom:14px; }
  .progress { height:7px; background:var(--border); border-radius:99px; overflow:hidden; margin-bottom:14px; }
  .bar { height:100%; background:var(--accent); width:0%; transition:width .25s; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px; margin-bottom:12px; }
  label { display:block; font-size:0.86rem; color:var(--muted); margin:10px 0 4px; }
  input, select, textarea { width:100%; padding:10px; border-radius:8px; border:1px solid var(--border); background:#0b1220; color:var(--text); font-size:0.95rem; }
  .btn { width:100%; padding:12px; border:none; border-radius:10px; font-weight:600; font-size:0.95rem; cursor:pointer; margin-top:8px; }
  .btn-primary { background:var(--accent); color:#082f49; }
  .btn-ok { background:var(--ok); color:#052e16; }
  .btn-sec { background:#334155; color:var(--text); }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:6px; }
  .pill { flex:1; min-width:44px; text-align:center; padding:9px 6px; border-radius:8px; border:1px solid var(--border); background:#0b1220; color:var(--text); font-size:0.88rem; cursor:pointer; }
  .pill.active { background:var(--accent); color:#082f49; border-color:var(--accent); font-weight:700; }
  .chat-box { background:#0b1220; border:1px solid var(--border); border-radius:10px; padding:10px; margin:8px 0; font-size:0.86rem; }
  .turn { margin-bottom:6px; }
  .stu { color:#cbd5e1; }
  .tut { color:#7dd3fc; }
  .badge { display:inline-block; padding:2px 8px; border-radius:99px; font-size:0.75rem; background:#0369a1; color:#e0f2fe; margin-bottom:6px; }
  .status { margin-top:10px; padding:10px; border-radius:8px; font-size:0.86rem; display:none; }
  .status.ok { display:block; background:#052e16; border:1px solid #16a34a; color:#bbf7d0; }
  .status.err { display:block; background:#450a0a; border:1px solid #dc2626; color:#fecaca; }
</style>
</head>
<body>
  <h1>EduTerm — Öğrenci Değerlendirme</h1>
  <div class="sub">Boğaziçi Üni. CMPE 492 • Gerçek Katılımcı Test Uygulaması</div>
  <div class="progress"><div class="bar" id="progBar"></div></div>
  <div id="app"></div>

<script>
const CEFR_ITEMS = [
  {
    id: "CEFR_C01",
    concept: "Tehlike Kavramı",
    model_id: "onpolicy_dpo_v2",
    text: "Tehlike, işyerinde henüz bir kaza veya yaralanma gerçekleşmemiş olsa bile zarar verme potansiyeli taşıyan kaynak ya da durumdur. Örneğin zemindeki ıslaklık veya koruyucusuz duran bir makine, kimse düşmese veya yaralanmasa dahi bir tehlikedir.",
    quiz: "Duran ama keskin kenarlı koruyucusuz bir makine tehlike sayılır mı?",
    options: ["Evet, zarar verme potansiyeli taşıdığı için tehlikedir", "Hayır, ancak biri yaralanırsa tehlike olur", "Emin değilim"],
    correct: 0
  },
  {
    id: "CEFR_OOD04",
    concept: "KVKK: Açık Rıza İstisnaları",
    model_id: "cefr_b1_card",
    text: "Kişisel veri işlemek için her zaman açık rıza gerekmez. Kanunlarda açıkça öngörülmesi, bir sözleşmenin kurulması veya ifası için zorunlu olması (örneğin maaş ödemesi için IBAN alınması) gibi hukuki sebepler varsa açık rıza olmadan da veri işlenebilir.",
    quiz: "Çalışana maaş ödemek için IBAN bilgisini işlerken açık rıza şart mıdır?",
    options: ["Hayır, sözleşmenin ifası kapsamında hukuki sebep vardır", "Evet, her veri için mutlaka açık rıza gerekir", "Emin değilim"],
    correct: 0
  },
  {
    id: "CEFR_OOD01",
    concept: "Dinamik Programlama",
    model_id: "base_14b",
    text: "Dinamik programlama, büyük bir problemi alt problemlere bölerken aynı alt problemlerin defalarca tekrarlandığı (örtüşen alt problemler) durumlarda hesaplanan sonuçları bellekte saklayarak tekrar hesaplamayı önleyen optimizasyon yöntemidir.",
    quiz: "Dinamik programlamayı Böl ve Yönet (Divide & Conquer) yönteminden ayıran temel özellik nedir?",
    options: ["Örtüşen alt problemlerin sonuçlarını bellekte saklaması", "Problemi hiç bölmemesi", "Emin değilim"],
    correct: 0
  }
];

const AB_PAIRS = [
  {
    id: "AB_01",
    concept: "Tehlike vs. Kaza (İSG)",
    left_model: "task_separated_hybrid",
    right_model: "onpolicy_dpo_v2",
    left_turns: [
      { s: "Hoca, tehlike sadece kaza olduğunda mı var? Islak zemin tehlike sayılmaz mı?", t: "Tehlike sadece kazadan oluşmayıp, ıslak zemin gibi ortamların da tehlike olabileceğini düşündünüz mü? Bu durumları nasıl sınıflandırırız?" },
      { s: "Islak zeminde düşmek de zararlı olabilir.", t: "Evet, potansiyel zararlara işaret eder. Bu duruma karşı ne tür önlemler alınabileceğini düşünürsünüz?" }
    ],
    right_turns: [
      { s: "Hoca, tehlike sadece kaza olduğunda mı var? Islak zemin tehlike sayılmaz mı?", t: "Çok iyi bir noktaya değindin. Kaza henüz gerçekleşmeden önce de ıslak zemin veya duran bir makine zarar potansiyeli taşır mı, ne dersin?" },
      { s: "Evet hocam, kimse düşmese bile kayma riski var.", t: "Harika! İşte henüz zarar oluşmadan var olan bu potansiyele 'tehlike' diyoruz. Peki bunu azaltmak için ilk adımın ne olur?" }
    ]
  },
  {
    id: "AB_02",
    concept: "Ramak Kala Olayı",
    left_model: "onpolicy_dpo_v2",
    right_model: "task_separated_hybrid",
    left_turns: [
      { s: "Hocam kimseye bir şey olmadıysa ramak kala olayı raporlamaya gerek var mı?", t: "Kimseye zarar gelmemiş olması o tehlikenin ortadan kalktığı anlamına gelir mi? Yarın aynı yerde başka biri geçerse ne olabilir?" },
      { s: "Aslında yarın birinin başına düşebilir, haklısınız.", t: "Kesinlikle! Ramak kala olaylarını raporlamak, gerçek bir kaza olmadan önlem almamızı sağlayan en önemli erken uyarıdır." }
    ],
    right_turns: [
      { s: "Hocam kimseye bir şey olmadıysa ramak kala olayı raporlamaya gerek var mı?", t: "Ramak kala olaylarında yaralanma olmaz ancak olay raporlanmalıdır. İş sağlığı açısından bunun neden önemli olduğunu açıklayabilir misiniz?" },
      { s: "Tekrar etmesin diye herhalde.", t: "Doğru, tekrar etmesini önlemek için kayıt altına alınır ve kök neden analizi yapılır." }
    ]
  },
  {
    id: "AB_03",
    concept: "KVKK: Anonimleştirme vs. Pseudonimizasyon",
    left_model: "task_separated_hybrid",
    right_model: "onpolicy_dpo_v2",
    left_turns: [
      { s: "Tablodan isimleri silip rastgele ID verirsek veri tamamen anonim olur değil mi?", t: "Eğer başka bir tabloda o ID'nin hangi kişiye ait olduğu eşleştirilebiliyorsa, bu veri geri döndürülemez sayılır mı?" },
      { s: "Eşleştirilebiliyorsa kişi hâlâ bulunabilir.", t: "Aynen öyle; buna takma adlandırma (pseudonimizasyon) denir ve hâlâ kişisel veri kapsamındadır." }
    ],
    right_turns: [
      { s: "Tablodan isimleri silip rastgele ID verirsek veri tamamen anonim olur değil mi?", t: "Güzel bir soru. Elinde ID-isim eşleştirme anahtarı olan biri o kişiyi tekrar bulabilirse sence bu işlem geri döndürülemez midir?" },
      { s: "Hayır hocam, anahtar varsa kişi bulunur.", t: "Tam isabet! Ek bilgiyle kişi yeniden belirlenebiliyorsa bu pseudonimizasyondur ve KVKK koruması sürer. Gerçek anonimleştirme nasıl olmalı sence?" }
    ]
  }
];

let state = {
  step: 0,
  participant_id: "",
  department: "",
  self_level: "Lisans (B2)",
  consent: true,
  server_url: "http://192.168.1.100:8765",
  cefr_evaluations: CEFR_ITEMS.map(x => ({ id: x.id, concept: x.concept, model_id: x.model_id, clarity_score: 0, turkish_score: 0, quiz_answer: -1 })),
  ab_evaluations: AB_PAIRS.map((x, idx) => {
    const flip = (idx % 2 === 1);
    return {
      id: x.id,
      concept: x.concept,
      flipped: flip,
      shown_A_model: flip ? x.right_model : x.left_model,
      shown_B_model: flip ? x.left_model : x.right_model,
      choice: "", // "A", "B", "tie"
      preferred_model: "",
      socratic_rating: 0,
      comment: ""
    };
  })
};

if (window.AndroidBridge) {
  try {
    const d = AndroidBridge.loadDraft();
    if (d) state = Object.assign(state, JSON.parse(d));
  } catch (e) {}
}

function persist() {
  if (window.AndroidBridge) AndroidBridge.saveDraft(JSON.stringify(state));
}

function render() {
  const totalSteps = 1 + CEFR_ITEMS.length + AB_PAIRS.length + 1;
  document.getElementById("progBar").style.width = Math.round((state.step / (totalSteps - 1)) * 100) + "%";
  const app = document.getElementById("app");

  if (state.step === 0) {
    app.innerHTML = `
      <div class="card">
        <h2>1. Katılımcı Bilgileri & Onay</h2>
        <label>Anonim Rumuz / Öğrenci Kodu</label>
        <input id="pid" placeholder="Örn: OGR-01" value="${state.participant_id}">
        <label>Bölüm / Sınıf</label>
        <input id="dept" placeholder="Örn: Bilgisayar Müh. 3. Sınıf" value="${state.department}">
        <label>Konu Hakimiyet Düzeyiniz</label>
        <select id="lvl">
          <option ${state.self_level==='Başlangıç (B1)'?'selected':''}>Başlangıç (B1)</option>
          <option ${state.self_level==='Lisans (B2)'?'selected':''}>Lisans (B2)</option>
          <option ${state.self_level==='İleri (C1)'?'selected':''}>İleri (C1)</option>
        </select>
        <label>Toplayıcı Sunucu URL (İsteğe Bağlı)</label>
        <input id="srv" value="${state.server_url}">
        <p class="sub" style="margin-top:10px">Yanıtlarınız anonim olarak yalnızca Boğaziçi Üni. CMPE 492 bitirme projesi değerlendirmesinde kullanılacaktır.</p>
        <button class="btn btn-primary" onclick="startEval()">Değerlendirmeye Başla (${CEFR_ITEMS.length + AB_PAIRS.length} Kısa Görev)</button>
      </div>`;
    return;
  }

  if (state.step <= CEFR_ITEMS.length) {
    const idx = state.step - 1;
    const item = CEFR_ITEMS[idx];
    const ev = state.cefr_evaluations[idx];
    app.innerHTML = `
      <div class="card">
        <span class="badge">Bölüm 1 • Açıklama Testi (${idx + 1}/${CEFR_ITEMS.length})</span>
        <h2>${item.concept}</h2>
        <div class="chat-box">${item.text}</div>
        <label>1) Açıklama ne kadar anlaşılırdı? (1=Çok zor, 5=Çok net)</label>
        <div class="row">${[1,2,3,4,5].map(n => `<div class="pill ${ev.clarity_score===n?'active':''}" onclick="setCefr(${idx},'clarity_score',${n})">${n}</div>`).join('')}</div>
        <label>2) Türkçe akıcılığı ve doğallığı nasıldı? (1=Bozuk, 5=Çok doğal)</label>
        <div class="row">${[1,2,3,4,5].map(n => `<div class="pill ${ev.turkish_score===n?'active':''}" onclick="setCefr(${idx},'turkish_score',${n})">${n}</div>`).join('')}</div>
        <label>3) Kısa Kontrol: ${item.quiz}</label>
        ${item.options.map((opt, oi) => `<div class="pill ${ev.quiz_answer===oi?'active':''}" style="margin-top:6px;text-align:left;padding:10px" onclick="setCefr(${idx},'quiz_answer',${oi})">${opt}</div>`).join('')}
        <div class="row" style="margin-top:12px">
          <button class="btn btn-sec" style="flex:1" onclick="go(-1)">Geri</button>
          <button class="btn btn-primary" style="flex:2" onclick="nextCefr(${idx})">Devam Et</button>
        </div>
      </div>`;
    return;
  }

  const abIdx = state.step - 1 - CEFR_ITEMS.length;
  if (abIdx < AB_PAIRS.length) {
    const pair = AB_PAIRS[abIdx];
    const ev = state.ab_evaluations[abIdx];
    const turnsA = ev.flipped ? pair.right_turns : pair.left_turns;
    const turnsB = ev.flipped ? pair.left_turns : pair.right_turns;
    const fmt = (ts) => ts.map(t => `<div class="turn"><div class="stu"><b>Öğrenci:</b> ${t.s}</div><div class="tut"><b>Öğretmen:</b> ${t.t}</div></div>`).join('');
    app.innerHTML = `
      <div class="card">
        <span class="badge">Bölüm 2 • Kör A/B Karşılaştırma (${abIdx + 1}/${AB_PAIRS.length})</span>
        <h2>${pair.concept}</h2>
        <label>Öğretmen A</label>
        <div class="chat-box">${fmt(turnsA)}</div>
        <label>Öğretmen B</label>
        <div class="chat-box">${fmt(turnsB)}</div>
        <label>Hangi öğretmen kavramı ezberletmeden daha iyi kavrattı?</label>
        <div class="row">
          <div class="pill ${ev.choice==='A'?'active':''}" onclick="setAb(${abIdx},'A')">Öğretmen A</div>
          <div class="pill ${ev.choice==='tie'?'active':''}" onclick="setAb(${abIdx},'tie')">Eşit</div>
          <div class="pill ${ev.choice==='B'?'active':''}" onclick="setAb(${abIdx},'B')">Öğretmen B</div>
        </div>
        <label>Seçtiğiniz öğretmenin Sokratik yönlendirmesi (1–5)</label>
        <div class="row">${[1,2,3,4,5].map(n => `<div class="pill ${ev.socratic_rating===n?'active':''}" onclick="setAbScore(${abIdx},${n})">${n}</div>`).join('')}</div>
        <label>Kısa Yorum (İsteğe bağlı)</label>
        <input id="abCom" placeholder="Neden bu öğretmeni tercih ettiniz?" value="${ev.comment}" oninput="state.ab_evaluations[${abIdx}].comment=this.value;persist()">
        <div class="row" style="margin-top:12px">
          <button class="btn btn-sec" style="flex:1" onclick="go(-1)">Geri</button>
          <button class="btn btn-primary" style="flex:2" onclick="nextAb(${abIdx})">Devam Et</button>
        </div>
      </div>`;
    return;
  }

  // Final Submit & Export Screen
  const dpoWins = state.ab_evaluations.filter(x => x.preferred_model === 'onpolicy_dpo_v2').length;
  const hybWins = state.ab_evaluations.filter(x => x.preferred_model === 'task_separated_hybrid').length;
  app.innerHTML = `
    <div class="card">
      <span class="badge">Tamamlandı</span>
      <h2>Test Verilerini Gönder</h2>
      <p class="sub">Katılımınız için teşekkürler! Aşağıdan veriyi doğrudan araştırmacı sunucusuna gönderebilir veya WhatsApp/E-posta ile paylaşabilirsiniz.</p>
      <div class="chat-box">
        <b>Katılımcı:</b> ${state.participant_id || 'Anonim'} (${state.department || '-'})<br>
        <b>A/B Özeti:</b> DPO-v2=${dpoWins}, Hybrid=${hybWins}, Eşit=${AB_PAIRS.length - dpoWins - hybWins}
      </div>
      <label>Sunucu Adresi</label>
      <input id="finalSrv" value="${state.server_url}" oninput="state.server_url=this.value;persist()">
      <button class="btn btn-ok" onclick="sendToServer()">1) Sunucuya Gönder (HTTP POST)</button>
      <button class="btn btn-primary" onclick="shareNative()">2) WhatsApp / E-posta / Dosya ile Gönder</button>
      <div id="sendStatus" class="status"></div>
      <div class="row" style="margin-top:10px">
        <button class="btn btn-sec" style="flex:1" onclick="go(-1)">Geri</button>
        <button class="btn btn-sec" style="flex:1" onclick="resetAll()">Yeni Katılımcı</button>
      </div>
    </div>`;
}

function startEval() {
  state.participant_id = document.getElementById("pid").value.trim() || ("OGR-" + Math.floor(100 + Math.random()*900));
  state.department = document.getElementById("dept").value.trim();
  state.self_level = document.getElementById("lvl").value;
  state.server_url = document.getElementById("srv").value.trim();
  state.step = 1;
  persist();
  render();
}
function setCefr(i, k, v) { state.cefr_evaluations[i][k] = v; persist(); render(); }
function nextCefr(i) {
  const e = state.cefr_evaluations[i];
  if (!e.clarity_score || !e.turkish_score || e.quiz_answer < 0) { alert("Lütfen tüm soruları işaretleyin."); return; }
  go(1);
}
function setAb(i, ch) {
  const e = state.ab_evaluations[i];
  e.choice = ch;
  e.preferred_model = ch === "A" ? e.shown_A_model : (ch === "B" ? e.shown_B_model : "tie");
  persist(); render();
}
function setAbScore(i, n) { state.ab_evaluations[i].socratic_rating = n; persist(); render(); }
function nextAb(i) {
  const e = state.ab_evaluations[i];
  if (!e.choice || !e.socratic_rating) { alert("Lütfen tercihinizi ve puanınızı seçin."); return; }
  go(1);
}
function go(d) { state.step = Math.max(0, state.step + d); persist(); render(); window.scrollTo(0,0); }

function buildPayload() {
  return JSON.stringify({
    app_version: "1.0",
    submitted_at_client: new Date().toISOString(),
    participant_id: state.participant_id,
    department: state.department,
    self_level: state.self_level,
    cefr_evaluations: state.cefr_evaluations,
    ab_evaluations: state.ab_evaluations
  });
}

function sendToServer() {
  const st = document.getElementById("sendStatus");
  st.className = "status ok";
  st.innerText = "Gönderiliyor...";
  if (window.AndroidBridge) {
    AndroidBridge.postJson(state.server_url, buildPayload(), "onPostDone");
  } else {
    st.className = "status err";
    st.innerText = "AndroidBridge bulunamadı (tarayıcı önizleme modu).";
  }
}

function onPostDone(ok, msg) {
  const st = document.getElementById("sendStatus");
  st.className = ok ? "status ok" : "status err";
  st.innerText = msg;
}

function shareNative() {
  const summary = `CMPE 492 EduTerm Test Verisi | Katılımcı: ${state.participant_id} | Bölüm: ${state.department}`;
  if (window.AndroidBridge) {
    AndroidBridge.shareReport(summary, buildPayload());
  }
}

function resetAll() {
  if (confirm("Mevcut yanıtlar temizlenip yeni katılımcıya geçilsin mi?")) {
    if (window.AndroidBridge) AndroidBridge.saveDraft("");
    location.reload();
  }
}

render();
</script>
</body>
</html>
